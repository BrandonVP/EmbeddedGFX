sentence=Hardware-agnostic touch GUI framework for embedded displays.
paragraph=A menu/app/button GUI framework decoupled from the display and touch hardware through IDisplay/ITouch interfaces. Ships an app-registration system, themeable colors, and an optional theme-picker app. Backends are provided per project via small adapter classes. Targets Teensy 4.x, ESP32-S3, and Arduino Due.
